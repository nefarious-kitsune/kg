<!DOCTYPE html>
<html>
<head>
<title>Mightiest Kingdom - Miku's Shrine</title>
<link rel="icon" type="image/x-icon" href="/images/logo_mini.png">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kg.kitsune21.com/">
<meta property="og:image" content="https://kg.kitsune21.com/assets/icons/site_info.png">
<meta property="og:title" content="Mightiest Kingdom">
<meta property="og:description"
  content="Mightiest Kingdom is a weekly event in the Transition Phase and the Seasonal Phase">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="../../../assets/css/common.css" rel="stylesheet">
<link href="../../../assets/css/content.css" rel="stylesheet">
<script src="../../../assets/js/mini-cal.js"></script>
<script>
  const ESICal = {
    startDays: [],
    eventDays: [
      1, 2, 3, 4, 5, 6,
      8, 9, 10, 11, 12, 13,
      15, 16, 17, 18, 19, 20,
      22, 23, 24, 25, 26, 27,
    ],
    endDays: [],
    throneDay: 0,
  };
  document.addEventListener('DOMContentLoaded', (e) => {
    document.getElementById('thisSeasonCalContainer').appendChild(
      makeSeasonCal('cal-template', 'this-season', ESICal)
    );
  });
</script>
</head>
<body>

<header><nav><ul class="breadcrumb">
  <li><a href="../../../content">Home</a></li>
  <li><a href="../../">Events</a></li>
  <li><a href="../">Regular</a></li>
  <li>Mightiest Kingdom</li>
</ul></nav></header>

<main>
<h1>Mightiest Kingdom</h1>

<section>
<p>
  Mightiest Kingdom is a weekly <a href="../">regular event</a> that happens
  on Monday through Saturday every week in the
  <a href="../../seasons/transition-phase">Transition Phase</a>
  and <a href="../../seasons/phase-3">Phase 3</a> of server.</p>
</section>

<template id="cal-template">
<table class="basic-table border-row mini-cal">
<thead>
<tr>
  <th class="week-num"></th>
  <th class="mon">Mon.</th>
  <th class="tue">Tue.</th>
  <th class="wed">Wed.</th>
  <th class="thu">Thu.</th>
  <th class="fri">Fri.</th>
  <th class="sat">Sat.</th>
  <th class="sun">Sun.</th>
</tr>
</thead>
<tbody>
<tr class="week-1">
  <td class="week-num">Week 1</td>
  <td class="day-1"><span class="day-of-month">4</span></td>
  <td class="day-2"><span class="day-of-month">5</span></td>
  <td class="day-3"><span class="day-of-month">6</span></td>
  <td class="day-4"><span class="day-of-month">7</span></td>
  <td class="day-5"><span class="day-of-month">8</span></td>
  <td class="day-6"><span class="day-of-month">9</span></td>
  <td class="day-7"><span class="day-of-month">10</span></td>
</tr>
<tr class="week-2">
  <td class="week-num">Week 2</td>
  <td class="day-8"><span class="day-of-month">11</span></td>
  <td class="day-9"><span class="day-of-month">12</span></td>
  <td class="day-10"><span class="day-of-month">13</span></td>
  <td class="day-11"><span class="day-of-month">14</span></td>
  <td class="day-12"><span class="day-of-month">15</span></td>
  <td class="day-13"><span class="day-of-month">16</span></td>
  <td class="day-14"><span class="day-of-month">17</span></td>
</tr>
<tr class="week-3">
  <td class="week-num">Week 3</td>
  <td class="day-15"><span class="day-of-month">18</span></td>
  <td class="day-16"><span class="day-of-month">19</span></td>
  <td class="day-17"><span class="day-of-month">20</span></td>
  <td class="day-18"><span class="day-of-month">21</span></td>
  <td class="day-19"><span class="day-of-month">22</span></td>
  <td class="day-20"><span class="day-of-month">23</span></td>
  <td class="day-21"><span class="day-of-month">24</span></td>
</tr>
<tr class="week-4">
  <td class="week-num">Week 4</td>
  <td class="day-22"><span class="day-of-month">25</span></td>
  <td class="day-23"><span class="day-of-month">26</span></td>
  <td class="day-24"><span class="day-of-month">27</span></td>
  <td class="day-25"><span class="day-of-month">28</span></td>
  <td class="day-26"><span class="day-of-month">29</span></td>
  <td class="day-27"><span class="day-of-month">30</span></td>
  <td class="day-28"><span class="day-of-month">Dec</span></td>
</tr>
</tbody>
</table>
</template>

<section id="schedule">
<h2>Schedule</h2>
<div id="thisSeasonCalContainer" class="calContainer"><h3>Current Season</h3></div>
</section>

<section id="overview">
<h2>Overview</h2>
<ul class="compact-list">
  <li><a href="./rewards">Rewards</a></li>
</ul>
</section>

</main>
</body>
</html>
