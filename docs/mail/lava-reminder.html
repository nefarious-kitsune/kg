<textarea id="input">&lt;size=40&gt;Important Reminder on &lt;color=maroon&gt;Lava Haka&lt;/color&gt;&lt;/size&gt;

- Lava Haka will &lt;color=blue&gt;disappear&lt;/color&gt; 10 minutes after summon.

- When you start a rally, you must wait for 5 minutes before your troops start marching toward the Lava Haka.

So,

- If you can, use a hero that with bonus &lt;color=blue&gt;Marching Speed&lt;/color&gt; (for example, 1-star Gabriel)

- If you have Pedra (bunny girl) or Miku at 2-star, use them. They have bonus speed and can &lt;color=navy&gt;recover&lt;/color&gt; all battle damage from a Lava Haka rally.

- If you are online when a Lava Haka is summoned, start a rally but do not join rallies by others so more people can participate.

- If you come online &lt;i&gt;late&lt;/i&gt; and the Lava Haka has &lt;b&gt;less than 5 minutes&lt;/b&gt; left on the clock, do not start a rally because you won't have time. Instead, join someone’s rally instead.</textarea>
