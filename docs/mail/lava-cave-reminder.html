<div class="editor-container">

  --><button class="text-button" onclick="copyInput()">Copy</button><!--

  --><button class="color-button color-black" onclick="setColor('black')"><span></span></button><!--

  --><button class="color-button color-teal" onclick="setColor('teal')"><span></span></button><!--
  --><button class="color-button color-blue" onclick="setColor('blue')"><span></span></button><!--
  --><button class="color-button color-navy" onclick="setColor('navy')"><span></span></button><!--
  --><button class="color-button color-purple" onclick="setColor('purple')"><span></span></button><!--
  --></div>
  <div class="group"><!--
  --><button class="editor-button" onclick="setBold()">Bold</button><!--
  --><button class="editor-button" onclick="setItalic()">Italic</button><!--
  --><button class="editor-button" onclick="setBig()">Big</button><!--
  --></div>
</div>

<textarea id="input">&lt;size=60&gt;&lt;color=maroon&gt;Hello everyone!&lt;/color&gt;&lt;/size&gt;
