<!DOCTYPE html>
<html>
<head><title>Hint Templates - Miku's Shrine</title></head>
<body>

<template --hint-id="search-map"><div class="hint"
  >Use the search button to search for monsters and gold mines.
  <img src="/assets/screenshots/map-search-button.png"></div
></template>

<template --hint-id="esb-alliance-supply"><span class="hint"
  >Restore <span class="number">50</span>%
  power for all Alliance members</span
></template>
  
<template --hint-id="esb-suppressing-holy-water"><span class="hint"
  >Invalidates the Evil Spirit King’s healing skill
  for <span class="number">60</span> seconds</span
></template>

<template --hint-id="esb-alliance-inspiration"><span class="hint"
  >Increases points for all Alliance members in
  the Evil Spirit Battlefield by <span class="number">50</span>%
  for <span class="number">60</span> seconds</span
></template>

<template --hint-id="esb-counter-holy-sword"><span class="hint"
  >Invalidate the Elemental Titan's immunity skill
  for <span class="number">60</span> seconds</span
></template>

<template --hint-id="esb-heavenly-fire"><span class="hint"
  >Dealing <span class="number">90</span>% damage
  to enemy targets within a circular range, and
  <span class="number">30</span>% damage to monster leader</span
></template>

</body>
</html>
