<html>
<head>
<title>Wishing Crystal Ball Planner (Season 1)</title>
<meta page-data
  og-desc="Tool for planning Wishing Crystal Ball for players in Expedition Season 1"
>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="../../assets/css/default.css" rel="stylesheet">
<link href="../../assets/css/content.css" rel="stylesheet">
<link href="../../assets/css/heroes.css" rel="stylesheet">
<link href="./crystal-planner.css" rel="stylesheet">
<script src="./crystal-planner.js"></script>
</head>

<body>

<header><nav><ul class="breadcrumb">
  <li><a href="../../content">Home</a></li>
  <li><a href="../">Tools</a></li>
  <li><a href="./">Wishing Crystal Ball</a></li>
  <li>Planner (Season 1)</li>
</ul></nav></header>

<main>
<h1>Wishing Crystal Ball Planner</h1>

<section>
<div class="hero-avatar ssr" id="Hero-Avatar-1" tabindex="0"></div>
<label><span
  >Hero Name</span
  ><select class="hero-selector" id="Hero-1" onchange="calc(-1)">
  <fragment src="./__templates/s1-hero-options.md"/>
  </select
></label>

<label><span
  >Current Star Level</span
  ><select class="star-level-selector" id="Current-Level-1" onchange="calc(-1)">
  <fragment src="./__templates/star-level-options.md"/>
  </select
></label>

<label><span
  >Target Star Level</span
  ><select class="star-level-selector" id="Target-Level-1" onchange="calc(-1)">
  <fragment src="./__templates/star-level-options.md"/>
  </select
></label>

<label><span
    text-hint="Number of cards as shown on the hero avatar icon"
    >Available cards</span
  ><input id="Available-Card-1"  onchange="calc(-1)"
    type="number" min="0" max="2000" value="0"
></label>

<label><span>Draws needed</span
  ><output id="result-1">0</output
  > <button onclick="reset(-1)">Reset</button
></label>

</section>
