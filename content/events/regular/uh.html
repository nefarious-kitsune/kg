<html>
<head>
<title>Ultimate Hunting</title>
<meta page-data
  og-desc="Ultimate Hunting is bi-weekly event in the Seasonal Phase"
  tag-list= "event"
>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="../../assets/css/default.css" rel="stylesheet">
<link href="../../assets/css/content.css" rel="stylesheet">
<script src="../../assets/js/mini-cal.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', (e) => {
    document.getElementById('thisSeasonCalContainer').appendChild(
      makeSeasonCal('cal-template', 'this-season', UHCalendar)
    );
    document.getElementById('nextSeasonCalContainer').appendChild(
      makeSeasonCal('cal-template', 'next-season', UHCalendar)
    );
  });
</script>
</head>
<body>

<header><nav><ul class="breadcrumb">
  <li><a href="../../../content">Home</a></li>
  <li><a href="../../">Events</a></li>
  <li><a href="../">War</a></li>
  <li>{{TITLE}}</li>
</ul></nav></header>

<main>
<h1>{{TITLE}}</h1>

<template id="cal-template">
<fragment src="../__temp/season-cal.md"/>
</template>

<section>
<div class="split-col-wrapper">
<div id="thisSeasonCalContainer" class="col"></div>
<div id="nextSeasonCalContainer" class="col"></div>
</div>
</section>

</main>
</body>
</html>
