<head>
  <title>Alliance Notice</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="../assets//css/common.css" rel="stylesheet">
  <link href="../assets//css/content.css" rel="stylesheet">
  <link href="./mail.css" rel="stylesheet">
  <script src="./mail.js"></script>
  <script src="./parser.js"></script>
</head>

<body class="content">

<header><nav><ul class="breadcrumb">
  <li><a href="../content">Home</a></li>
  <li><a href="./">Mail</a></li>
  <li>Online Mail Editor</li>
</ul></nav></header>

<main class="content">
<h1>{{TITLE}}</h1>

<p>{{PAGE-DESC}}</p>

<section>
<h2>Edit</h2>
<div class="toolbar">
  <div class="group"><!--
  --><button class="editor-button" onclick="copyInput()">Copy</button><!--
  --></div>
  <div class="group"><!--
  --><button class="editor-button" onclick="validateInput()">Preview</button><!--
  --></div>
  <div class="group"><!--
  --><button class="color-button color-gray"   onclick="setColor('gray')"><span></span></button><!--
  --><button class="color-button color-silver" onclick="setColor('silver')"><span></span></button><!--
  --><button class="color-button color-white" onclick="setColor('white')"><span></span></button><!--
  --><button class="color-button color-maroon"   onclick="setColor('maroon')"><span></span></button><!--
  --><button class="color-button color-green"   onclick="setColor('green')"><span></span></button><!--
  --><button class="color-button color-red"   onclick="setColor('red')"><span></span></button><!--
  --><button class="color-button color-fuchsia" onclick="setColor('fuchsia')"><span></span></button><!--
  --><button class="color-button color-yellow" onclick="setColor('yellow')"><span></span></button><!--
  --><button class="color-button color-lime"   onclick="setColor('lime')"><span></span></button><!--
  --><button class="color-button color-aqua"   onclick="setColor('aqua')"><span></span></button><!--
  --></div>
  <div class="group"><!--
  --><button class="editor-button" onclick="setBold()" style="font-weight: bold;">B</button><!--
  --></div>
</div>

<textarea id="input"><escape-me>
<size=60><color=fuchsia>Welcome</color></size>
<size=40><color=yellow>
Welcome to the family. We require <color=lime>Discord</color> activity. Contact our R4 for the link to our Discord server.</color>
<color=white>
<color=red><b>Ground Rules</b></color>
☆ <color=red><b>Do not</b></color> attack in normal Mithril
☆ <color=red><b>Do not</b></color> attack for gold or PvP point. <i>Ask in Kingdom Chat first</i>
☆ <color=red><b>Do not</b></color> start a rally during ESI or Lava Haka
☆ <color=green><b>Do</b></color> read mail and chat BEFORE starting rallies when you first log in!
</color></size>
</escape-me></textarea>
</section>

<section>
<h2>Preview</h2>
<div id="output" class="message">
</div>
</section>

</main>
</body>
</html>
