<html>
<head>
<title>Alliance Announcement Template</title>
<meta page-data
  og-desc="Announcement template for a new alliance in the first week of a server"
  tag-list= "alliance announcement"
>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="../assets/css/common.css" rel="stylesheet">
<link href="../assets/css/content.css" rel="stylesheet">
<link href="./mail.css" rel="stylesheet">
<script src="./mail.js"></script>
<script src="./parser.js"></script>
</head>

<body>

<header><nav><ul class="breadcrumb">
  <li><a href="../content">Home</a></li>
  <li><a href="./">Mail</a></li>
  <li>Announcement Editor</li>
</ul></nav></header>

<main>

<h1>{{TITLE}}</h1>
<p>{{PAGE-DESC}}</p>

<div class="editor-container">
<section id="edit-pane">
<h2>Edit</h2>
<fragment src="__toolbar-message.html"/>
<textarea id="input" placeholder="Enter your announcement message"><escape-me
  ><fragment src="./templates/__alliance_welcome.md"/></escape-me
></textarea>
</section>

<section id="preview-pane">
<h2>Preview</h2>
<div id="output" class="message">
</div>
</section>
</div>

<fragment src="__note.html"/>

</main>
</body>
</html>
