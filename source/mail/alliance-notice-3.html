<html>
<head>
<title>Alliance Announcement Template</title>
<meta page-data
  og-desc="Announcement template for an alliance during Burning Expedition"
  tag-list= "alliance mail"
>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="../assets/css/common.css" rel="stylesheet">
<link href="../assets/css/content.css" rel="stylesheet">
<link href="./mail.css" rel="stylesheet">
<script src="./mail.js"></script>
<script src="./parser.js"></script>
</head>

<body>

<header><nav><ul class="breadcrumb">
  <li><a href="../content">Home</a></li>
  <li><a href="./">Mail</a></li>
  <li>Announcement Editor</li>
</ul></nav></header>

<main>

<h1>{{TITLE}}</h1>
<p>{{PAGE-DESC}}</p>

<div class="editor-container">
<section id="edit-pane">
<h2>Edit</h2>
<fragment src="__templates/__toolbar-notice.html"/>
<textarea id="input" placeholder="Enter your announcement message"><escape-me
  ><fragment src="./__announcement/annoucement-3.md"/></escape-me
></textarea>
</section>

<section id="preview-pane">
<h2>Preview</h2>
<div id="output" class="notice"></div>
</section>
</div>

<fragment src="__templates/__note.html"/>

</main>
</body>
</html>
