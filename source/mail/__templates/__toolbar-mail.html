<div class="toolbar">
  <div class="button-group"><!--
  --><button class="tool-button copy" onclick="copyInput()" title="Copy"></button><!--
  --></div>
  <div class="button-group"><!--
  --><button class="tool-button undo" onclick="undoAction()"></button><!--
  --><button class="tool-button redo" onclick="redoAction()"></button><!--
  --></div>
  <div class="button-group"
    ><div class="dropdown"
      ><button
        title="Set text size"
        class="dropdown-button tool-button text-size"
        onclick="showDropdownList('size-list')"></button
      ><div id="size-list" class="dropdown-content"><a
        ><span style="font-size: 12px">40px</span></a
        ><a href="#" onclick="setSize(45)"><span style="font-size: 18px">45px</span></a
        ><a href="#" onclick="setSize(50)"><span style="font-size: 20px">50px</span></a
        ><a href="#" onclick="setSize(60)"><span style="font-size: 24px">60px</span></a
      ></div
    ></div
  ></div>
  <div class="button-group"
    ><button class="tool-button bold" onclick="setBold()" title="Bold"></button
    ><button class="tool-button italic" onclick="setItalic()" title="Italic"></button
    ><div class="dropdown"
      ><button
        title="Set text color"
        class="dropdown-button tool-button text-color"
        onclick="showDropdownList('color-list')"></button
      ><div id="color-list" class="dropdown-content"><a
          href="#" onclick="setColor('#D0D')"><span
          class="color-chip" style="background-color: #D0D;"></span></a
        ><a
          href="#" onclick="setColor('#F3F')"><span
          class="color-chip" style="background-color: #F3F;"></span></a
        ><a
          href="#" onclick="setColor('#B00')"><span
          class="color-chip" style="background-color: #B00;"></span></a
        ><a
          href="#" onclick="setColor('#F00')"><span
          class="color-chip" style="background-color: #F00;"></span></a
        ><a
          href="#" onclick="setColor('#B30')"><span
          class="color-chip" style="background-color: #b30;"></span></a
        ><a
          href="#" onclick="setColor('#F50')"><span
          class="color-chip" style="background-color: #F50;"></span></a
        ><a
          href="#" onclick="setColor('#060')"><span
          class="color-chip" style="background-color: #060;"></span></a
        ><a
          href="#" onclick="setColor('#081')"><span
          class="color-chip" style="background-color: #081;"></span></a
        ><a
          href="#" onclick="setColor('#04D')"><span
          class="color-chip" style="background-color: #04D;"></span></a
        ><a
          href="#" onclick="setColor('#07F')"><span
          class="color-chip" style="background-color: #07F;"></span></a
        ><a
          href="#" onclick="setColor('#222')"><span
          class="color-chip" style="background-color: #222;"></span></a
        ></div
    ></div
  ></div>
</div>
