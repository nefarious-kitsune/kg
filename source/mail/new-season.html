<html>
<head>
<title>End-of-Season Reminder Mail Template</title>
<meta page-data
  og-imag="mail"
  og-desc="Mail template for reminder message at end of a Burning Expedition season"
  tag-list= "alliance mail"
>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="../assets/css/common.css" rel="stylesheet">
<link href="../assets/css/content.css" rel="stylesheet">
<link href="../assets/toolbars/toolbars.css" rel="stylesheet">
<script src="../assets/toolbars/toolbars.js"></script>
<link href="./mail.css" rel="stylesheet">
<script src="./mail.js"></script>
<script src="./parser.js"></script>
</head>

<body>

<header><nav><ul class="breadcrumb">
  <li><a href="../content">Home</a></li>
  <li><a href="./">Mail</a></li>
  <li>Online Mail Editor</li>
</ul></nav></header>

<main>
<h1>{{TITLE}}</h1>

<p>{{PAGE-DESC}}</p>

<div class="editor-container">
<section id="edit-pane">
<h2>Edit</h2>
<fragment src="__templates/__toolbar-mail.html"/>
  
<textarea id="input" placeholder="Enter your Alliance Mail message"><escape-me
  ><fragment src="./__mail/new-season.md"/></escape-me
></textarea>
</section>

<section id="preview-pane">
<h2>Preview</h2>
<div id="output" class="mail"></div>
</section>
</div>

<fragment src="__templates/__note.html"/>

</main>
</body>
</html>
