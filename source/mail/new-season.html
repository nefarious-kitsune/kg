<head>
  <title>End-of-Season Reminder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="./mail.css" rel="stylesheet">
  <script src="./mail.js"></script>
  <script src="./parser.js"></script>
</head>

<body class="content">

  <header><nav><ul class="breadcrumb">
    <li><a href="../content">Home</a></li>
    <li><a href="./">Mail</a></li>
    <li>Online Mail Editor</li>
  </ul></nav></header>

<main class="content">
<h1>{{TITLE}}</h1>

<p>{{PAGE-DESC}}</p>

<div class="editor-container">
<section id="edit-pane">
<h2>Edit</h2>
<div class="toolbar">
  <div class="group"><!--
  --><button class="text-button" onclick="copyInput()">Copy</button><!--
  --></div>
  <div class="group"><!--
  --><button class="color-button color-black" onclick="setColor('black')"><span></span></button><!--
  --><button class="color-button color-gray"  onclick="setColor('gray')"><span></span></button><!--
  --><button class="color-button color-maroon" onclick="setColor('maroon')"><span></span></button><!--
  --><button class="color-button color-red" onclick="setColor('red')"><span></span></button><!--
  --><button class="color-button color-green"  onclick="setColor('green')"><span></span></button><!--
  --><button class="color-button color-olive" onclick="setColor('olive')"><span></span></button><!--
  --><button class="color-button color-teal" onclick="setColor('teal')"><span></span></button><!--
  --><button class="color-button color-blue" onclick="setColor('blue')"><span></span></button><!--
  --><button class="color-button color-navy" onclick="setColor('navy')"><span></span></button><!--
  --><button class="color-button color-purple" onclick="setColor('purple')"><span></span></button><!--
  --></div>
  <div class="group"><!--
  --><button class="editor-button" onclick="setBold()">Bold</button><!--
  --><button class="editor-button" onclick="setItalic()">Italic</button><!--
  --><button class="editor-button" onclick="setBig()">Big</button><!--
  --></div>
</div>

<textarea id="input"><escape-me>
<color=maroon><size=60>REMINDER</size></color>
■ Remember to do your <color=navy>Elemental Lord</color>
■ At reset, remember to refresh your <color=navy>Alliance Challenge</color> until the quests are all SSR (gold)
■ Hit the <color=navy>Lava Cave</color> as soon as you can.
■ It's free server transfer week. After you port back to Normal Land, <color=navy>shield up</color>!
■ ESI will be at UTC 1800 as usual

Quack! Quack!
~ Commander Ducky <color=orange>(^)></color>
</escape-me></textarea>
</section>

<section id="preview-pane">
<h2>Preview</h2>
<div id="output" class="mail">
</div>
</section>
</div>

</main>
